<div class="chat-panel" [ngClass]="{'opened': status()}">
    <div class="header" (click)="toggleChat()">
        @if (!status()) {
            <button>
                <mat-icon>message</mat-icon>
            </button>
        }
        @else {
            @if (status()) {
                <button>
                    <mat-icon>message</mat-icon>
                </button>
            }
            <button>
                <mat-icon>close</mat-icon>
            </button>
        }
    </div>

    @if (status()) {
        <div class="chat-body">
            <div class="chat" #chatContainer>
                @for (message of _chat(); track $index) {
                    <div class="message" [ngClass]="{'sender': message.sender_fk?.name === _player().name}" [style.--player-color]="message.sender_fk?.color">
                        <span class="sender">{{message.sender_fk?.name}}</span>
                        <p class="content">{{message.message}}</p>
                        <span class="time">{{message.time}}</span>
                    </div>
                }
            </div>
            <div class="input">
                <input type="text" placeholder="Votre message" [(ngModel)]="message" (keydown.enter)="sendMessage()" />
                <button class="medium-icon" (click)="sendMessage()">
                    <mat-icon>send</mat-icon>
                </button>
            </div>
        </div>
    }
</div>
