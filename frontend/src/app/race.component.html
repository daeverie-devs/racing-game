<div class="race-container">
    @if (isAdmin()) {
        <admin-panel [currentGame]="currentGame()"
                     [currentRace]="currentRace()"
                     [totalBid]="totalBid()"
                     [messages]="newMessages()"
                     (onFetchGame)="onFetchGame()"
                     (onStartGame)="onStartGame()"
                     (onNextStatus)="onNextStatus()"
                     (onCloseBets)="onCloseBets()"
        />
    }
    @else {
        @if (status() !== 'started') {
            <login-screen (onConnect)="connect()" (onUpdatePlayer)="onUpdatePlayer($event)" [status]="status()" />
        }
        @else {
            <div class="game-container">
                <player-panel [player]="player()" />

                <game-panel [currentGame]="currentGame()"
                            [currentRace]="currentRace()"
                            [totalBid]="totalBid()"
                            [player]="player()"
                            (onBet)="onBet($event)"
                            (onFetchGame)="onFetchGame()"
                />

                <chat-panel [chat]="chat()"
                            [player]="player()"
                            (onFetchChat)="onFetchChat()"
                            (onSendMessage)="onSendMessage($event)"
                />
            </div>
        }
    }
</div>
